<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Info Display</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: auto;
      text-align: center;
    }

    .container {
      display: flex;
      width: 100%;
      margin: 70px auto;

      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .box {
      width: 270px;
      padding: 10px;

      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .box img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 8px;
    }

    button {
      margin-top: 10px;
      padding: 8px 15px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #2980b9;
    }

    #detailParagraph {
      margin-top: 30px;
      font-size: 16px;
      color: #333;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Mobile Box -->
    <div class="box">
      <img src="mobile.png" alt="Mobile">
      <button onclick="showDetail('This is a mobile phone, useful for communication, apps, and internet browsing.')">Show Mobile Info</button>
    </div>

    <!-- University Box -->
    <div class="box">
      <img src="uni.jpg" alt="University">
      <button onclick="showDetail('This is a university building, a place for higher education and research.')">Show University Info</button>
    </div>

    <!-- Computer Box -->
    <div class="box">
      <img src="pc.jpg" alt="Computer">
      <button onclick="showDetail('A computer is used for programming, designing, and computing tasks.')">Show Computer Info</button>
    </div>
  </div>

  <!-- Detail Paragraph (only one shown below) -->
  <p id="detailParagraph"></p>

  <script>
    function showDetail(text) {
      const para = document.getElementById('detailParagraph');
      para.textContent = text;
      para.style.display = 'block';
    }
  </script>

</body>
</html>
